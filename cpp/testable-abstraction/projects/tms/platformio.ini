[platformio]
name = "TMS"
include_dir = Inc
src_dir = Src

[env]
build_type = debug
debug_build_flags = -g

[env:vehicle]
platform = ststm32
platform_packages = platformio/toolchain-gccarmnoneeabi@^1.140201.0
framework = stm32cube
board = nucleo_f767zi
upload_protocol = stlink

build_flags =
    -std=c++20
    -Werror
    -Wall
    -Wno-unused-function ;  having problems with unused MPU_Config()
board_build.ldscript = STM32F767ZITX_FLASH.ld

lib_deps = 
    mincrmatt12/STM32Cube Middleware-FreeRTOS@10.3.1+f4-1.26.1
custom_freertos_heap_impl = ""
custom_freertos_config_location = Inc/FreeRTOSConfig.h

extra_scripts = 
    pre:scripts/add_hardfloat.py

